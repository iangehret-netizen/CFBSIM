<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#13335f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CFB Dynasty"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>CFB Dynasty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: phone app shell. Team-colored press-box header, stat-sheet cards, fixed tab bar. */
:root {
  --bg: #e9edf2; --surface: #ffffff; --surface2: #f4f6f9; --ink: #121a28; --muted: #5a6577; --line: #d3d9e2;
  --good: #1d7f47; --bad: #b8332a; --warn: #9a6512; --team: #0021A5; --on-team: #ffffff; --turf: #2f7d3a; --turf-line: rgba(255,255,255,.35);
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0c1119; --surface: #151c28; --surface2: #1b2433; --ink: #e6ebf2; --muted: #95a1b3; --line: #273142; --good: #3fb072; --bad: #e0625a; --warn: #d9a441; --turf: #23602c; color-scheme: dark; } }
:root[data-theme="dark"] { --turf: #23602c; --bg: #0c1119; --surface: #151c28; --surface2: #1b2433; --ink: #e6ebf2; --muted: #95a1b3; --line: #273142; --good: #3fb072; --bad: #e0625a; --warn: #d9a441; color-scheme: dark; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--team); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
input, select, textarea { font-size: 16px !important; }
.search { display: flex; gap: 6px; align-items: center; }
.search .inp { flex: 1; min-width: 0; }
.pad { padding: 12px 14px; }
.need { font-weight: 800; color: var(--team); margin-left: 2px; }
.chips button.on .need { color: inherit; }
.need.zero { color: var(--muted); font-weight: 600; }
.cks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.ck { display: flex; align-items: center; gap: 8px; font-size: .9rem; min-height: 36px; }
.ck input { width: 20px; height: 20px; accent-color: var(--team); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--team); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; margin: 0 0 6px; text-wrap: balance; }
h1 { font-size: 2.4rem; } h2 { font-size: 1.7rem; } h3 { font-size: 1.5rem; }
p { margin: 6px 0; }
.num { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
.big { font-size: 1.45rem; }
.small { font-size: .82rem; } .dim { color: var(--muted); } .b { font-weight: 600; } .r { text-align: right; } .center { text-align: center; }
.bad { color: var(--bad); } .warn { color: var(--warn); } .up { color: var(--good); } .down { color: var(--bad); }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 6px; }
.eyebrow.pad { padding: 12px 14px 0; }
.mt { margin-top: 14px; }
.row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.stack > *, .start > *, .main > * { min-width: 0; max-width: 100%; }
.start { grid-template-columns: minmax(0, 1fr); }
.row > *, .li > .grow, .cmp > *, .vs > * { min-width: 0; }
.li > .grow, .news, .head, .bubble, p { overflow-wrap: anywhere; }
.main, .start { overflow-x: clip; }
.sheet { overflow-x: hidden; }
.sheet b, .sheet h3, .vs b { overflow-wrap: anywhere; min-width: 0; }
.sheet > * { min-width: 0; max-width: 100%; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--team); color: var(--on-team); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tm { flex: 1; min-width: 0; }
.tm-name { font-family: var(--display); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-sub { font-size: .8rem; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv { flex: none; border: 0; border-radius: 999px; padding: 9px 14px; background: var(--on-team); color: var(--team); font-family: var(--display); font-weight: 700; font-size: .92rem; text-transform: uppercase; letter-spacing: .03em; max-width: 52vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv:disabled { opacity: .55; }
.main { padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { border: 0; background: none; padding: 8px 0 7px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: .72rem; font-weight: 600; }
.tab svg { width: 22px; height: 22px; fill: currentColor; stroke: currentColor; stroke-width: 0; }
.tab:nth-child(4) svg, .tab:nth-child(5) svg { fill: none; stroke-width: 2; }
.tab.on { color: var(--ink); }
.tab.on svg { color: var(--team); }

/* cards and lists */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-align: left; width: 100%; display: block; }
button.card { cursor: pointer; }
.card.flush { padding: 0; overflow: hidden; }
.card.accent { border-color: var(--team); box-shadow: inset 4px 0 0 var(--team); }
.list { display: grid; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; min-height: 48px; }
.card > .li:first-child, .list > .li:first-child, .card .eyebrow + .li { border-top: 0; }
.card:not(.flush) .li { padding-left: 0; padding-right: 0; }
button.li:disabled { opacity: 1; cursor: default; }
.li.me { background: color-mix(in srgb, var(--team) 10%, transparent); }
.li.starter .num:first-child { color: var(--team); }
.li.on, .pickc.on { outline: 2px solid var(--team); outline-offset: -2px; }
.pos { font-family: var(--display); font-weight: 600; font-size: .8rem; color: var(--muted); width: 26px; flex: none; text-align: center; }
.li > .num:first-child { width: 26px; text-align: center; flex: none; }
.li > .num.pk { width: auto; min-width: 46px; text-align: left; }
.pg { font-family: var(--display); font-weight: 600; color: var(--muted); width: 22px; text-align: center; }
.rk { font-family: var(--display); font-weight: 600; font-size: .78em; color: var(--muted); margin-right: 3px; }
.tchip { display: inline-grid; place-items: center; min-width: 44px; height: 24px; padding: 0 6px; border-radius: 5px; background: var(--c); color: #fff; font-family: var(--display); font-weight: 700; font-size: .78rem; letter-spacing: .02em; flex: none; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.ovr { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; height: 26px; display: inline-grid; place-items: center; border-radius: 6px; font-size: .95rem; flex: none; }
.ovr.elite { background: var(--good); color: #fff; }
.ovr.good { background: var(--ink); color: var(--surface); }
.ovr.mid { background: var(--surface2); border: 1px solid var(--line); }
.ovr.low { border: 1px solid var(--line); color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }

/* controls */
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 42px; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: .84rem; }
.btn.ic { width: 34px; padding: 0; }
.btn.pri { background: var(--team); color: var(--on-team); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; padding: 0; color: inherit; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; min-height: 42px; }
.inp.sm { width: auto; min-height: 34px; padding: 5px 8px; }
textarea.inp { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.lbl { display: block; font-size: .82rem; font-weight: 600; margin: 10px 0 4px; }
.seg { display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; border: 0; background: none; padding: 8px 10px; border-radius: 7px; font-weight: 600; font-size: .86rem; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-family: var(--display); font-weight: 600; font-size: .85rem; }
.chips button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.switch { width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; }
.switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch.on { background: var(--team); } .switch.on i { left: 23px; }
.bar { flex: 1; height: 7px; background: var(--surface2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; display: block; min-width: 40px; }
.bar i { display: block; height: 100%; background: var(--team); }
.meter { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.meter > span:first-child { width: 92px; flex: none; }

/* home */
.game .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 8px 0 12px; }
.game .side { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.game .side b { font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; line-height: 1.05; }
.game .at { font-family: var(--display); color: var(--muted); font-weight: 600; text-transform: uppercase; }
.cmp { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.cmprow { display: grid; grid-template-columns: 1fr auto 1fr; text-align: center; align-items: center; }
.cmprow .num { font-size: 1.3rem; }
.cl { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.res .score { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 1.05rem; }
.res .score .num { font-size: 1.8rem; }
.wl { font-family: var(--display); font-weight: 700; font-size: 1.8rem; }
.res.w .wl { color: var(--good); } .res.l .wl { color: var(--bad); }
.res-s { font-family: var(--display); font-weight: 600; white-space: nowrap; }
.res-s.w { color: var(--good); } .res-s.l { color: var(--bad); }
.kv3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv3 > div { display: grid; }
.news { padding: 7px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.news:first-of-type { border-top: 0; }
.news.upset { box-shadow: inset 3px 0 0 var(--warn); padding-left: 9px; }
.head { padding: 8px 0; border-top: 1px solid var(--line); }
.head:first-of-type { border-top: 0; }
.head.top b { font-size: 1.05em; }
.head.upset b { color: var(--warn); }
.mail.unread b { font-weight: 700; }
.mail .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--team); flex: none; align-self: center; }
.scout { padding: 8px 10px; border-radius: 10px; background: var(--surface2); display: grid; gap: 2px; }
.card.foldable { position: relative; }
.card.foldable > :first-child { padding-right: 36px; }
.card.folded > :not(:first-child):not(.foldbtn) { display: none !important; }
.card.folded > :first-child { margin-bottom: 0; }
.foldbtn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: var(--surface2); color: var(--muted); display: grid; place-items: center; font-size: 14px; line-height: 1; }
.foldbtn::before { content: "▾"; transition: transform .15s; }
.card.folded .foldbtn::before { transform: rotate(-90deg); }
.foldbar { display: flex; justify-content: flex-end; gap: 12px; }
.gdbtns { display: flex; gap: 4px; flex: none; }
.gdbtns .btn { padding: 6px 8px; min-width: 0; }
.rotrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 10px; align-items: center; padding: 4px 0; }
.rotrow input[type=range] { width: 100%; accent-color: var(--team); }
.tbl.stat { table-layout: fixed; }
.tbl.stat th:first-child, .tbl.stat td:first-child { width: 38%; white-space: normal; overflow-wrap: anywhere; }
.tbl.stat th, .tbl.stat td { padding: 8px 4px; }
.tbl.stat th:first-child, .tbl.stat td:first-child { padding-left: 10px; }
.link.th { font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; text-decoration: none; }
.link.th.on { color: var(--ink); }
.case { background: linear-gradient(180deg, var(--surface) 0%, var(--surface2) 100%); }
.shelf-h { font-family: var(--display); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 3px solid var(--line); }
.plate { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.plate .pi { width: 30px; height: 30px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.plate .grow { min-width: 0; }
.rfpanel { display: grid; gap: 10px; margin-top: 8px; }
.rfgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.rfgrid label { display: grid; gap: 4px; min-width: 0; }
.edrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 68px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.edrow .inp.num { text-align: center; }
.battle { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.mailacts { display: flex; gap: 8px; padding: 0 14px 10px; }
.pitchrow { display: grid; gap: 6px; margin-top: 8px; }
.txt { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.txt:first-of-type { border-top: 0; }
.bubble { background: var(--surface2); border-radius: 14px 14px 14px 4px; padding: 8px 12px; max-width: 90%; font-size: 14px; }
.news.win { box-shadow: inset 3px 0 0 var(--good); padding-left: 9px; }
.news.loss, .news.inj { box-shadow: inset 3px 0 0 var(--bad); padding-left: 9px; }
.champ { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.champ b { font-family: var(--display); font-size: 1.6rem; text-transform: uppercase; }
.mv { width: 34px; text-align: right; font-family: var(--display); font-size: .8rem; }
.mv.up { color: var(--good); } .mv.down { color: var(--bad); }

/* recruiting */
.rec .intr { display: grid; gap: 4px; margin: 10px 0 8px; }
.ib { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 8px; }
.ib.me span:first-child { font-weight: 700; color: var(--team); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.score2 .num { margin-left: 4px; }

/* tables */
.tbl-wrap { overflow-x: auto; max-width: 100%; }
input[type=file], select.inp, .inp { max-width: 100%; min-width: 0; }
@media (max-width: 440px) {
  .tbl th, .tbl td { padding: 8px 5px; }
  .tbl th:first-child, .tbl td:first-child { padding-left: 10px; }
  .tbl td:first-child, .tbl .tlink { white-space: normal; }
  .tbl .tlink { gap: 4px; flex-wrap: wrap; }
  .card.flush.tbl-wrap { overflow-x: auto; }
  .tbl.fit { table-layout: fixed; }
  .tbl.fit th:not(:first-child), .tbl.fit td:not(:first-child) { width: 13%; }
  .tbl.fit th:nth-child(2), .tbl.fit td:nth-child(2) { width: 15%; }
  .tbl.fit td:first-child { overflow-wrap: anywhere; }
  .tbl td .tchip { min-width: 34px; }
}
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl th { font-family: var(--display); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 0; }
.tbl tr.me td { background: color-mix(in srgb, var(--team) 10%, transparent); }
.tbl tr.th td { font-family: var(--display); font-weight: 600; font-size: .78rem; color: var(--muted); text-transform: uppercase; background: var(--surface2); }
.tbl td .tchip { min-width: 40px; height: 20px; font-size: .7rem; margin-right: 4px; }
pre.code { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: .74rem; overflow-x: auto; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(5,10,18,.5); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 720px; margin: 0 auto; box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
.sheet-x { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; color: var(--muted); }
.ph { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; border-left: 4px solid var(--c); padding-left: 10px; margin: 4px 40px 10px 0; }
.phr { display: grid; justify-items: center; gap: 4px; }
.phr .ovr { min-width: 46px; height: 38px; font-size: 1.3rem; }
.attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
.attrs > div { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.final { display: grid; gap: 6px; margin: 8px 0 12px; }
.final > div { display: flex; align-items: center; gap: 10px; }
.final b { flex: 1; font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; }
.edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* start */
.start { padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
body:has(.start)::before { background: var(--bg); }
.hero { padding: 18px 0 6px; border-bottom: 3px solid var(--ink); }
.hero h1 { font-size: 2.7rem; }
.hero p { color: var(--muted); max-width: 52ch; }
.slot-h { display: flex; justify-content: space-between; }
.slot-t { font-family: var(--display); font-weight: 700; font-size: 1.4rem; text-transform: uppercase; }
.slot .row { margin-top: 10px; }

// ---------- awards ----------

    case "DL": return (s.sk || 0) * 7 + (s.tk || 0) * 0.8 + p.ovr * 1.2;
    case "LB": return (s.tk || 0) * 1 + (s.sk || 0) * 4 + (s.di || 0) * 6 + p.ovr * 0.6;
    case "CB": case "S": return (s.di || 0) * 9 + (s.tk || 0) * 0.6 + p.ovr * 1.2;

    case "RB": return `${fmt(s.ry)} rush yds, ${(s.rtd || 0)} TD`;
    case "WR": case "TE": return `${s.rec || 0} rec, ${fmt(s.rcy)} yds, ${s.rctd || 0} TD`;
    case "DL": return `${s.sk || 0} sacks, ${s.tk || 0} tackles`;
    case "LB": return `${s.tk || 0} tackles, ${s.sk || 0} sacks, ${s.di || 0} INT`;
    case "CB": case "S": return `${s.di || 0} INT, ${s.tk || 0} tackles`;

  const heis = best(heisScore, p => true, 5);
  const aw = { heisman: heis.map(snap), list: [] };
  const AWD = [["Maxwell Award", p => ["QB", "RB", "WR", "TE"].includes(p.pos), heisScore], ["Davey O'Brien Award", p => p.pos === "QB"], ["Doak Walker Award", p => p.pos === "RB"], ["Biletnikoff Award", p => p.pos === "WR"], ["John Mackey Award", p => p.pos === "TE"], ["Outland Trophy", p => p.pos === "OL" || p.pos === "DL"], ["Bronko Nagurski Trophy", p => ["DL", "LB", "CB", "S"].includes(p.pos)], ["Butkus Award", p => p.pos === "LB"], ["Jim Thorpe Award", p => p.pos === "CB" || p.pos === "S"], ["Lou Groza Award", p => p.pos === "K"]];

  G.awards[G.year] = aw;
  if (heis[0]) addNews(`${playerName(heis[0])} (${heis[0].pos}, ${T(heis[0].t).name}) wins the Heisman Trophy.`, heis[0].t === G.userTeam ? "win" : "");

  const keys = [["py", "Passing yards"], ["ptd", "Passing TD"], ["ry", "Rushing yards"], ["rtd", "Rushing TD"], ["rcy", "Receiving yards"], ["rctd", "Receiving TD"], ["sk", "Sacks"], ["di", "Interceptions"], ["tk", "Tackles"]];

    for (const p of allPlayersActive()) {

      const cur = G.records.nat[k]; if (!cur || v > cur.v) G.records.nat[k] = { v, n: playerName(p), t: T(p.t).abbr, y: G.year, label };
      { const pk = T(p.t).abbr; const pr = (G.records.prog[pk] = G.records.prog[pk] || {}); const c2 = pr[k]; if (!c2 || v > c2.v) pr[k] = { v, n: playerName(p), y: G.year, label }; }
    }

}

function seg(key, opts) { return `<div class="seg">${opts.map(([v, l]) => `<button class="${UI[key] === v ? "on" : ""}" data-a="set" data-k="${key}" data-v="${v}">${l}</button>`).join("")}</div>`; }
function bar(v, max) { return `<span class="bar"><i style="width:${clamp(v / max * 100, 2, 100)}%"></i></span>`; }
function ovrPill(v) { const c = v >= 85 ? "elite" : v >= 75 ? "good" : v >= 65 ? "mid" : "low"; return `<span class="ovr ${c}">${v}</span>`; }

// ---------- start / new game ----------
function renderStart() {
  if (UI.ng) return renderNewGame();
  const slots = [1, 2, 3].map(n => { const m = UI.slots[n]; return `<div class="slot card">
    <div class="slot-h"><span class="eyebrow">Save ${n}</span>${m ? `<span class="dim small">${new Date(m.at).toLocaleDateString()}</span>` : ""}</div>
    ${m ? `<div class="slot-t">${esc(m.team)}</div><div class="dim">${esc(m.coach)} · ${esc(m.label)} · Career ${esc(m.rec)}</div>
      <div class="row gap"><button class="btn pri" data-a="load" data-v="${n}">Continue</button><button class="btn" data-a="newgame" data-v="${n}">New dynasty here</button></div>`
      : `<div class="dim">Empty</div><div class="row gap"><button class="btn pri" data-a="newgame" data-v="${n}">New dynasty</button></div>`}
  </div>`; }).join("");
  return `<div class="start">
    <div class="hero"><div class="eyebrow">Signing Day · February 2009</div><h1>CFB Dynasty</h1><p>Take over any of the 120 FBS programs in 2009. Recruit real classes you upload each year, set the depth chart, and sim your way through the BCS era, the four-team playoff and the twelve-team bracket.</p></div>
    <div class="stack">${slots}</div>
    <div class="card"><div class="eyebrow">Import a save file</div><p class="dim small">Load a dynasty you exported from this app.</p><input type="file" id="saveFile" accept=".txt,.json" data-ch="importSave"></div>
    <p class="dim small center">${esc(UI.cloudNote || "")}</p>

}

    <div class="eyebrow mt">Starting job</div>

    ${Object.keys(POSC).includes(ng.role || "") ? `<div class="chips mt">${Object.keys(POSC).map(k => `<button class="${ng.role === k ? "on" : ""}" data-a="ngrole" data-v="${k}">${esc(POSC_N[k])}</button>`).join("")}</div>` : ""}

  const tiers = [["easy", "Easy", t => t.pres >= 80], ["normal", "Normal", t => t.pres >= 60 && t.pres < 80], ["hard", "Hard", t => t.pres >= 45 && t.pres < 60], ["vhard", "Very Hard", t => t.pres < 45]];

    <div class="list">${list.map(t => `<button class="li ${ng.team === t.i ? "on" : ""}" data-a="ngteam" data-v="${t.i}"><span class="tchip" style="--c:${t.color}">${esc(t.abbr)}</span><span class="grow"><b>${esc(t.name)}</b><span class="dim small"> ${esc(t.conf)}</span></span><span class="small">${stars(Math.max(1, Math.round((t.pres - 25) / 14)))}</span></button>`).join("")}</div>

// ---------- home ----------
function renderHome() {
  if (G.nfl) return renderNflHome();
  if (G.phase === "off") return offExtra() + renderOffseason();
  const u = userT(); const parts = [];
  if (G.phase === "pre" || G.phase === "reg") {
    const g = userGame(G.week || 1);
    if (g) {
      const opp = g.h === u.id ? g.a : g.h; const ot = opp >= 0 ? T(opp) : null; const lt = g.low != null ? LT(g.low) : null;
      const ur = teamRating(u), or = ot ? teamRating(ot) : lt ? lowRating(lt) : fcsRating();
      parts.push(`<section class="card game">
        <div class="eyebrow">Week ${g.wk} · ${g.nm ? esc(g.nm) + " · " : ""}${g.n ? "Neutral site" : g.h === u.id && !g.away ? "Home" : "Away"}${g.rv && opp >= 0 ? " · " + esc(trophyOf(g.h, g.a)[0] || trophyOf(g.h, g.a)[1]) : ""}${g.cg ? " · Conference" : ""}</div>
        <div class="vs"><div class="side">${chip(u)}<b>${esc(u.name)}</b><span class="dim small">${recStr(u)}</span></div><div class="at">${g.h === u.id && !g.away ? "vs" : "at"}</div>
        <div class="side">${ot ? chip(ot) : lt ? `<span class="tchip" style="--c:${lt.color}">${esc(lt.abbr)}</span>` : `<span class="tchip" style="--c:#777">FCS</span>`}<b>${ot ? tname(opp) : esc(g.fcs)}</b><span class="dim small">${ot ? recStr(ot) : lt ? `${lt.w}-${lt.l} · ${esc(lt.conf)}` : "FCS"}</span></div></div>
        <div class="cmp">${[["Offense", ur.off, or.off], ["Defense", ur.def, or.def]].map(([l, a, b]) => `<div class="cmprow"><span class="num">${Math.round(a)}</span><span class="cl">${l}</span><span class="num">${Math.round(b)}</span></div>`).join("")}</div>
      </section>`);
    } else if (G.phase === "reg") parts.push(`<section class="card"><div class="eyebrow">Week ${G.week}</div><p>Bye week. Use the extra time for recruiting.</p></section>`);
  }
  if (G.phase === "cc") { const st = confStandings(u.conf); const top2 = st.slice(0, 2).map(t => t.id); parts.push(`<section class="card"><div class="eyebrow">Championship Week</div><p>${top2.includes(u.id) && TITLE_GAME_FROM[u.conf] && G.year >= TITLE_GAME_FROM[u.conf] ? `You're in the ${esc(u.conf)} Championship against ${tname(top2.find(x => x !== u.id))}.` : `Conference title games are this week. Bowl and playoff selections follow.`}</p></section>`); }
  if (G.phase === "post") {
    const mine = G.sched.filter(g => g.wk === 20 + G.post.round && (g.h === u.id || g.a === u.id) && !g.d)[0];
    parts.push(`<section class="card"><div class="eyebrow">${postRoundName()}</div>${mine ? `<p class="big">${esc(mine.nm)}</p><p>${tname(mine.h)} vs ${tname(mine.a)}</p>` : `<p>${G.sched.some(g => g.k !== "reg" && g.k !== "cc" && (g.h === u.id || g.a === u.id)) ? "Your season is over. Watch the rest of the postseason play out." : "You didn't make a bowl this year."}</p>`}<button class="btn" data-a="go" data-tab="season" data-sub="post">View postseason</button></section>`);
  }
  parts.push(campCard(), renderWeekPrep(), goalsCard(), renderInboxCard(), renderCaptainsCard());
  // last result
  const last = G.sched.filter(g => g.d && (g.h === u.id || g.a === u.id)).sort((a, b) => b.wk - a.wk)[0];
  if (last) { const us = last.h === u.id ? last.hs : last.as, th = last.h === u.id ? last.as : last.hs; parts.push(`<button class="card res ${us > th ? "w" : "l"}" data-a="game" data-v="${last.i}"><div class="eyebrow">Last game${last.nm ? " · " + esc(last.nm) : ""}</div><div class="score"><span class="wl">${us > th ? "W" : "L"}</span> <span class="num">${us}–${th}</span> <span>${last.h === u.id ? "vs" : "at"} ${oppName(last, u.id)}</span></div><div class="dim small">${esc(last.wx || "")} · Tap for box score</div></button>`); }
  // class status
  if (!G.classSource && G.recruits.length === 0) parts.push(classPrompt());
  // recruiting summary
  if (G.recruits.length) { const cm = classCount(G.userTeam); parts.push(`<button class="card" data-a="go" data-tab="rec"><div class="eyebrow">${G.classYear} recruiting</div><div class="kv3"><div><span class="num big">${G.hours}</span><span class="dim small">hours left</span></div><div><span class="num big">${cm}</span><span class="dim small">commits</span></div><div><span class="num big">${Math.max(0, classCap(G.userTeam) - cm)}</span><span class="dim small">scholarships open</span></div></div></button>`); }
  // injuries
  const hurt = u.roster.map(P).filter(p => p.inj > 0 || p.sus > 0 || p.sit);
  if (hurt.length) parts.push(`<section class="card"><div class="eyebrow">Unavailable</div>${hurt.slice(0, 8).map(p => `<button class="li" data-a="player" data-v="${p.id}"><span class="pos">${p.pos}</span><span class="grow">${esc(playerName(p))}</span><span class="tag bad">${p.inj ? (p.inj >= 99 ? "Season" : p.inj + " wk") : p.sus ? "Susp " + p.sus : "Transfer sit-out"}</span></button>`).join("")}</section>`);
  parts.push(`<section class="card"><div class="eyebrow">News</div>${G.news.slice(0, 14).map(n => `<div class="news ${n.k}"><span class="dim small">${n.y}${n.w ? " W" + n.w : ""}</span> ${esc(n.s)}</div>`).join("") || `<p class="dim">Nothing yet.</p>`}</section>`);
  return `<div class="stack">${parts.join("")}</div>`;
}
function classPrompt() {

  <div class="row gap"><button class="btn pri" data-a="more" data-v="upload">Upload class</button><button class="btn" data-a="fictional">Use generated recruits</button></div></section>`;

// ---------- offseason ----------
function renderOffseason() {
  const s = G.off.step, u = userT(), c = G.coach;
  if (s === "recap") {
    const h = G.history[G.history.length - 1]; const me = c.seasons[c.seasons.length - 1]; const aw = G.awards[G.year];
    return `<div class="stack">
      <section class="card hero2"><div class="eyebrow">${G.year} National Champion</div><div class="champ">${chip(T(h.champ))}<b>${esc(T(h.champ).name)}</b><span class="dim">${recStr(T(h.champ))}</span></div></section>
      <section class="card"><div class="eyebrow">Your season</div><div class="kv3"><div><span class="num big">${me.w}-${me.l}</span><span class="dim small">record</span></div><div><span class="num big">${me.exp}</span><span class="dim small">wins expected</span></div><div><span class="num big">${me.rk || "NR"}</span><span class="dim small">final rank</span></div></div>
      <div class="meter"><span class="dim small">Job security</span>${bar(c.sec, 100)}<span class="num small">${c.sec}</span></div>
      ${c.sec < 15 ? `<p class="bad">The athletic director has fired you. You'll pick a new job after the draft.</p>` : c.sec < 35 ? `<p class="warn">Your seat is getting hot. Another down year could cost you the job.</p>` : ""}</section>
      <section class="card"><div class="eyebrow">Heisman Trophy</div>${aw.heisman.map((x, i) => `<div class="li"><span class="num">${i + 1}</span><span class="grow"><b>${esc(x[1])}</b> <span class="dim small">${x[2]}, ${x[3]}</span><br><span class="small">${esc(x[4])}</span></span></div>`).join("")}</section>
      <section class="card"><div class="eyebrow">Final AP top 10</div>${G.ap.slice(0, 10).map((id, i) => `<div class="li"><span class="num">${i + 1}</span><span class="grow">${esc(T(id).name)}</span><span class="num">${recStr(T(id))}</span></div>`).join("")}</section>
    </div>`;
  }
  if (s === "draft") {
    const mine = G.draft.filter(d => d.t === G.userTeam);
    return `<div class="stack">
      <section class="card"><div class="eyebrow">${G.year + 1} NFL Draft · your players</div>${mine.length ? mine.map(d => `<div class="li"><span class="num pk">R${d.rd}·${d.pk}</span><span class="pos">${d.pos}</span><span class="grow">${esc(d.n)}</span>${ovrPill(d.ovr)}</div>`).join("") : `<p class="dim">None of your players were drafted.</p>`}</section>
      <section class="card"><div class="eyebrow">Leaving the program</div>${G.departed.map(d => `<div class="li"><span class="pos">${d.pos}</span><span class="grow">${esc(d.n)}</span><span class="tag">${d.w === "early" ? "Declared early" : "Graduated"}</span>${ovrPill(d.ovr)}</div>`).join("") || `<p class="dim">Nobody.</p>`}</section>
      <section class="card"><div class="eyebrow">First round</div>${G.draft.slice(0, 32).map(d => `<div class="li"><span class="num">${d.pk}</span><span class="pos">${d.pos}</span><span class="grow">${esc(d.n)}</span><span class="dim small">${esc(T(d.t).abbr)}</span></div>`).join("")}</section></div>`;
  }
  if (s === "stay") return renderStay();
  if (s === "jobs") return renderJobsStep();
  if (s === "portal") {
    if (G.year < 2018) return `<div class="stack"><section class="card"><div class="eyebrow">Transfers</div><p class="dim small">The transfer portal opens in 2018. Until then, transferring players sit out a year at their new school.</p>${G.leftUser.length ? G.leftUser.map(p => `<div class="li"><span class="pos">${p.pos}</span><span class="grow">${esc(p.n)}</span>${ovrPill(p.ovr)}<span class="tag bad">Transferred</span></div>`).join("") : `<p>Nobody on your roster asked to transfer.</p>`}</section></div>`;
    const list = G.portal.filter(e => e.from !== G.userTeam && P(e.id)).sort((a, b) => P(b.id).ovr - P(a.id).ovr).slice(0, 80);
    return `<div class="stack"><section class="card"><div class="eyebrow">Transfer portal</div><p class="small">${G.pitches} pitch${G.pitches === 1 ? "" : "es"} left · ${Math.max(0, classCap(G.userTeam))} scholarships open${G.year < 2021 ? " · Undergraduate transfers sit out a year until 2021" : ""}</p>
      ${G.leftUser.length ? `<p class="bad small">Entered the portal from your team: ${G.leftUser.map(p => esc(p.n) + " (" + p.pos + ")").join(", ")}</p>` : ""}</section>
      <section class="card">${list.map(e => { const p = P(e.id); return `<div class="li"><span class="pos">${p.pos}</span><span class="grow"><button class="link" data-a="player" data-v="${p.id}">${esc(playerName(p))}</button> <span class="dim small">${yrLabel(p)} · ${esc(T(e.from).abbr)}</span></span>${ovrPill(p.ovr)}${e.pitched ? `<span class="tag ${e.ok ? "good" : "bad"}">${e.ok ? "Signed" : "Said no"}</span>` : `<button class="btn sm" data-a="pitch" data-v="${e.id}">${Math.round(portalChance(e) * 100)}%</button>`}</div>`; }).join("") || `<p class="dim">The portal is empty.</p>`}</section></div>`;
  }
  if (s === "signing") {
    const lc = G.lastClass; const top = G.classRank.slice(0, 15);
    return `<div class="stack"><section class="card"><div class="eyebrow">${lc.year} signing class · ${lc.picks.length} signees</div>${lc.picks.sort((a, b) => b.stars - a.stars).map(r => `<div class="li"><span class="pos">${r.pos}</span><span class="grow">${esc(r.n)} <span class="dim small">${r.st}</span></span><span class="small">${stars(r.stars)}</span></div>`).join("") || `<p class="dim">You didn't sign anyone. Walk-ons will fill the roster.</p>`}</section>
      <section class="card"><div class="eyebrow">Team class rankings</div>${top.map(([id, p, r]) => `<div class="li ${id === G.userTeam ? "me" : ""}"><span class="num">${r}</span><span class="grow">${esc(T(id).name)}</span><span class="num dim">${p}</span></div>`).join("")}${(() => { const m = G.classRank.find(x => x[0] === G.userTeam); return m && m[2] > 15 ? `<div class="li me"><span class="num">${m[2]}</span><span class="grow">${esc(u.name)}</span><span class="num dim">${m[1]}</span></div>` : ""; })()}</section></div>`;
  }
  if (s === "ath") {
    const list = G.teams[G.userTeam].roster.map(P).filter(p => p && p.ath && p.yr === 1);
    const opt = (sel, none) => (none ? `<option value="none" ${!sel ? "selected" : ""}>None</option>` : "") + ATH_POS.map(x => `<option ${x === sel ? "selected" : ""}>${x}</option>`).join("");
    return `<div class="stack"><section class="card accent"><div class="eyebrow">Athletes · pick their positions</div><p class="small">These signees were recruited as athletes (ATH). Pick his main position, and a second one if you want him to play both ways. He shows up on the depth chart at both and rates a little lower at the second spot.</p></section>
      ${list.map(p => `<section class="card"><div class="row between"><div><button class="link b" data-a="player" data-v="${p.id}">${esc(playerName(p))}</button> <span class="dim small">${p.st}</span><br><span class="small">${stars(p.stars)}</span></div>${ovrPill(p.ovr)}</div>
        <div class="row gap mt"><label class="grow"><span class="lbl">Main position</span><select class="inp" id="ath1_${p.id}" data-ch="athPos" data-k="1" data-v="${p.id}">${opt(p.pos)}</select></label>

        <p class="dim small">${p.pos2 ? `${p.pos} ${p.ovr} OVR · ${p.pos2} ${p.ovr2} OVR` : `${p.pos} only · ${p.ovr} OVR`}</p></section>`).join("") || `<section class="card"><p class="dim">No athletes in this class.</p></section>`}</div>`;
  }
  if (s === "train" && G.progMode === "manual") {
    UI._cut = renderCutCard();
    const mine = u.roster.map(P).filter(Boolean).sort((a, b) => POS.indexOf(a.pos) - POS.indexOf(b.pos) || b.ovr - a.ovr);
    const list = mine.filter(p => UI.posF === "All" || p.pos === UI.posF);
    const pts = G.devPts || 0;
    return `<div class="stack">${UI._cut}<section class="card accent"><div class="eyebrow">Player development · manual</div>
      <div class="row between"><span><span class="num big">${pts}</span> <span class="dim small">development point${pts === 1 ? "" : "s"} left</span></span><span class="row gap"><button class="btn sm" data-a="devreset">Reset</button><button class="btn sm pri" data-a="devauto" ${pts ? "" : "disabled"}>Auto-assign rest</button></span></div>
      <p class="dim small">Each point adds 1 to a player's overall, up to ${DEV_MAX} per player this offseason. "Suggested" is what he'd have gained on auto. Points you don't spend are handed out automatically when you continue.</p></section>
      <div class="chips">${["All", ...POS].map(x => `<button class="${UI.posF === x ? "on" : ""}" data-a="set" data-k="posF" data-v="${x}">${x}</button>`).join("")}</div>
      <section class="card flush">${list.map(p => { const room = devRoom(p); const base = p.ovr - (p.devG || 0); return `<div class="li"><span class="pos">${p.pos}</span><span class="grow"><button class="link" data-a="player" data-v="${p.id}">${esc(playerName(p))}</button> <span class="dim small">${yrLabel(p)} · POT ${potGrade(p)}</span><br><span class="small dim">${p.devOld != null && p.devOld !== base ? `Dropped ${p.devOld}→${base} · ` : ""}Suggested +${p.devSug || 0}${p.devG ? ` · <b class="up">+${p.devG} given</b>` : ""}</span></span>${ovrPill(p.ovr)}<button class="btn sm" data-a="dev" data-v="${p.id}" data-k="1" ${pts && room ? "" : "disabled"} aria-label="Add 1 to ${esc(playerName(p))}">+1</button><button class="btn sm" data-a="dev" data-v="${p.id}" data-k="3" ${pts && room ? "" : "disabled"} aria-label="Add 3 to ${esc(playerName(p))}">+3</button></div>`; }).join("")}</section></div>`;

    else {
      const rounds = [...new Set(G.sched.filter(g => g.wk > 20).map(g => g.wk))].sort();
      body = rounds.reverse().map(w => { const gs = G.sched.filter(g => g.wk === w).sort((a, b) => (b.po || 0) - (a.po || 0) || (b.ny6 || 0) - (a.ny6 || 0)); return `<section class="card flush"><div class="eyebrow pad">Round ${w - 20}</div>${gs.map(g => `<button class="li ${g.h === u || g.a === u ? "me" : ""}" data-a="game" data-v="${g.i}" ${g.d ? "" : "disabled"}><span class="grow"><span class="${g.po ? "b" : "dim"} small">${esc(g.nm)}</span><br>${tname(g.h)} ${g.d ? `<span class="num">${g.hs}</span>` : ""} · ${tname(g.a)} ${g.d ? `<span class="num">${g.as}</span>` : ""}</span></button>`).join("")}</section>`; }).join("");

// ---------- trophy case ----------
function trophyCase() {
  const c = G.coach;
  // case 1: rivalry trophies, championships, coaching awards
  const riv = {};
  for (const [k, h] of Object.entries(G.rivH || {})) for (const x of h.games) {
    const tid = coachTeamIn(x.y); if (tid < 0 || T(tid).abbr !== x.w) continue;
    const [a, b] = k.split("-"); const A = byAbbr(a), B = byAbbr(b); if (!A || !B) continue;
    const [tr, nm] = trophyOf(A.id, B.id); const key = tr || nm;
    (riv[key] = riv[key] || { tr: !!tr, opp: (T(tid).abbr === a ? B : A).name, ys: [] }).ys.push(x.y);
  }
  const champs = [];
  for (const s of c.seasons.filter(s => !s.nfl)) { if (s.nc) champs.push([s.y, "National championship", s.tn]); if (s.cc) champs.push([s.y, "Conference championship", s.tn]); }
  for (const b of (c.bowlLog || []).filter(b => b.won)) champs.push([b.y, b.nm + (b.opp ? ` over ${b.opp}` : ""), b.t]);
  for (const a of (c.awards || []).filter(a => a.title)) champs.push([a.y, a.nm, a.t]);
  champs.sort((x, y) => y[0] - x[0]);
  const awards = (c.awards || []).filter(a => !a.title).slice().sort((a, b) => b.y - a.y);
  // case 2: honors won by players you coached
  const pl = { nat: [], aa: [], ac: [] };
  for (const [y, aw] of Object.entries(G.awards || {})) {
    const tid = coachTeamIn(+y); if (tid < 0) continue;
    (aw.heisman || []).slice(0, 1).forEach(x => { if (x[5] === tid) pl.nat.push([+y, "Heisman Trophy", x[1], x[2]]); });
    (aw.list || []).forEach(([nm, x]) => { if (x[5] === tid) pl.nat.push([+y, nm, x[1], x[2]]); });
    for (const pos in (aw.aa || {})) (aw.aa[pos] || []).forEach(x => { if (x[5] === tid) pl.aa.push([+y, `All-American ${pos}`, x[1], x[2]]); });
    for (const cf in (aw.ac || {})) for (const pos in aw.ac[cf]) (aw.ac[cf][pos] || []).forEach(x => { if (x[5] === tid) pl.ac.push([+y, `All-${cf} ${pos}`, x[1], x[2]]); });
  }
  for (const k in pl) pl[k].sort((a, b) => b[0] - a[0]);
  const shelf = (items, empty) => items.length ? items.join("") : `<p class="dim small">${empty}</p>`;
  const plate = (y, title, sub, icon) => `<div class="plate"><span class="pi" aria-hidden="true">${icon}</span><span class="grow"><b class="small">${esc(title)}</b><br><span class="dim small">${esc(sub)}</span></span><span class="num small">${y}</span></div>`;
  const tog = k => UI["tc_" + k] ? "" : " hidden";
  return `<section class="card case"><div class="eyebrow">Trophy case · program and coaching</div>
    <div class="shelf-h">Rivalry trophies</div>${shelf(Object.entries(riv).sort((a, b) => b[1].ys.length - a[1].ys.length).map(([nm, r]) => plate(r.ys.length + "×", nm, `vs ${r.opp} · ${r.ys.sort().join(", ")}`, r.tr ? "🏆" : "⚔")), "No rivalry wins yet.")}
    <div class="shelf-h">Championships and bowls</div>${shelf(champs.map(([y, t, tn]) => plate(y, t, tn, t.startsWith("National") || t.includes("national") ? "🏆" : t.startsWith("Conference") ? "🥇" : "🏈")), "No titles or bowl wins yet.")}
    <div class="shelf-h">Coaching awards</div>${shelf(awards.map(a => plate(a.y, a.nm, a.t, "🎖")), "No coaching awards yet.")}</section>
  <section class="card case"><div class="eyebrow">Trophy case · players you coached</div>
    <div class="shelf-h">Heisman and national awards · ${pl.nat.length}</div>${shelf(pl.nat.map(([y, nm, n, pos]) => plate(y, nm, `${n}, ${pos}`, nm === "Heisman Trophy" ? "🏆" : "🏅")), "None yet.")}
    <div class="shelf-h">All-Americans · ${pl.aa.length}</div>${pl.aa.length ? `<button class="link small" data-a="tctog" data-v="aa">${UI.tc_aa ? "Hide" : "Show all"}</button><div${tog("aa")}>${pl.aa.map(([y, nm, n]) => plate(y, nm, n, "⭐")).join("")}</div>` : `<p class="dim small">None yet.</p>`}
    <div class="shelf-h">All-Conference · ${pl.ac.length}</div>${pl.ac.length ? `<button class="link small" data-a="tctog" data-v="ac">${UI.tc_ac ? "Hide" : "Show all"}</button><div${tog("ac")}>${pl.ac.map(([y, nm, n]) => plate(y, nm, n, "✦")).join("")}</div>` : `<p class="dim small">None yet.</p>`}
  </section>`;
}

let DB = null, UID = null, DL = null, saving = false, saveAgain = false, saveTimer = null;

function b64(buf) { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
function unb64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function pack(str) { if (window.CompressionStream) { try { const st = new Blob([str]).stream().pipeThrough(new CompressionStream("gzip")); return "Z:" + b64(await new Response(st).arrayBuffer()); } catch (e) { } } return "J:" + str; }
async function unpack(s) { if (s.startsWith("Z:")) { const st = new Blob([unb64(s.slice(2))]).stream().pipeThrough(new DecompressionStream("gzip")); return await new Response(st).text(); } return s.slice(2); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

async function loadSlots() {
  UI.slots = {};
  for (const n of [1, 2, 3]) {
    let local = null; try { local = JSON.parse(lsGet("gd_meta" + n) || "null"); } catch (e) { }
    let cloud = null;
    if (DB) { try { const s = await slotDoc(n).get(); if (s.exists) cloud = s.data(); } catch (e) { } }
    const pickC = cloud && (!local || cloud.at >= local.at);

});

function doImport(kind, text) {
  try {
    const res = kind === "rec" ? importRecruits(text) : importRosters(text);
    if (res.err) return toast(res.err);
    render();
    toast(kind === "rec" ? `Loaded ${res.n} recruits for ${G.classYear}${res.skip ? ` (${res.skip} rows skipped)` : ""}.` : `Rebuilt ${res.teams} roster${res.teams > 1 ? "s" : ""} with ${res.n} players${res.skip ? ` (${res.skip} rows skipped)` : ""}.`);
    saveSoon();
  } catch (e) { toast("Couldn't read that file. Check that it's a CSV with a header row."); }
}
async function exportSave() {
  const data = await pack(JSON.stringify(G));
  if (!DL) { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/plain" })); a.download = `dynasty-${userT().abbr.toLowerCase()}-${G.year}.txt`; document.body.appendChild(a); a.click(); a.remove(); toast("Save file downloaded."); } catch (e) { toast("Couldn't download the save file."); } return; }
  try { await DL.save({ filename: `dynasty-${userT().abbr.toLowerCase()}-${G.year}.txt`, data }); toast("Save file ready."); }
  catch (e) { toast(e && e.code === "declined" ? "Download cancelled." : "Couldn't download the save file."); }
}
async function importSaveText(txt) {
  try {
    const s = txt.trim(); const json = s.startsWith("{") ? s : await unpack(s);
    const g = JSON.parse(json); if (!g.teams || !g.players) throw 0;
    const empty = [1, 2, 3].find(n => !UI.slots[n]) || 3;
    G = g; UI.slot = empty; UI.tab = "home"; render(); toast(`Loaded into save ${empty}.`); saveGame();
  } catch (e) { toast("That isn't a dynasty save file."); }
}
function doAdvance(force) {
  if (UI.busy || G.live) return;
  if (G.phase === "pre" && !G.classSource && !G.recruits.length && !force) { UI.modal = { type: "confirmStart" }; render(); return; }
  if (!UI.gdPass && !G.skipGameday) { const pg = pendingUserGame(); if (pg) { UI.gdForce = !!force; UI.modal = { type: "gameday", id: pg.i }; render(); return; } }
  UI.gdPass = false;
  if (force && !G.recruits.length) useFictionalClass();
  UI.modal = null; UI.busy = true; render();
  setTimeout(() => {
    try { if (G.autoRec && G.autoRec.on && G.phase !== "off") runAutoRecruit(); advance(); } catch (e) { console.error(e); toast("Something went wrong simulating. Your last save is safe."); }
    UI.busy = false; UI.tab = "home"; render(); window.scrollTo(0, 0); saveGame();
  }, 40);
}

// no pinch or double-tap zoom
document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouch = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTouch < 300 && !e.target.closest("input,select,textarea")) e.preventDefault(); lastTouch = now; }, { passive: false });

// boot
(async function boot() {
  render();
  await cloudInit();
  await loadSlots();
  render();
})();
</script>

</body></html>
