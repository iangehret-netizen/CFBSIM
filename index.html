<title>Gridiron Dynasty '09</title>

<style>
/* Layout: phone app shell. Team-colored press-box header, stat-sheet cards, fixed tab bar. */
:root {
  --bg: #e9edf2; --surface: #ffffff; --surface2: #f4f6f9; --ink: #121a28; --muted: #5a6577; --line: #d3d9e2;
  --good: #1d7f47; --bad: #b8332a; --warn: #9a6512; --team: #0021A5; --on-team: #ffffff;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0c1119; --surface: #151c28; --surface2: #1b2433; --ink: #e6ebf2; --muted: #95a1b3; --line: #273142; --good: #3fb072; --bad: #e0625a; --warn: #d9a441; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0c1119; --surface: #151c28; --surface2: #1b2433; --ink: #e6ebf2; --muted: #95a1b3; --line: #273142; --good: #3fb072; --bad: #e0625a; --warn: #d9a441; color-scheme: dark; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--team); }
* { box-sizing: border-box; }
html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
input, select, textarea { font-size: 16px !important; }
.search { display: flex; gap: 6px; align-items: center; }
.search .inp { flex: 1; min-width: 0; }
.pad { padding: 12px 14px; }
.need { font-weight: 800; color: var(--team); margin-left: 2px; }
.chips button.on .need { color: inherit; }
.need.zero { color: var(--muted); font-weight: 600; }
.cks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.ck { display: flex; align-items: center; gap: 8px; font-size: .9rem; min-height: 36px; }
.ck input { width: 20px; height: 20px; accent-color: var(--team); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--team); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; margin: 0 0 6px; text-wrap: balance; }
h1 { font-size: 2.4rem; } h2 { font-size: 1.7rem; } h3 { font-size: 1.5rem; }
p { margin: 6px 0; }
.num { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
.big { font-size: 1.45rem; }
.small { font-size: .82rem; } .dim { color: var(--muted); } .b { font-weight: 600; } .r { text-align: right; } .center { text-align: center; }
.bad { color: var(--bad); } .warn { color: var(--warn); } .up { color: var(--good); } .down { color: var(--bad); }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 6px; }
.eyebrow.pad { padding: 12px 14px 0; }
.mt { margin-top: 14px; }
.row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 12px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--team); color: var(--on-team); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tm { flex: 1; min-width: 0; }
.tm-name { font-family: var(--display); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-sub { font-size: .8rem; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv { flex: none; border: 0; border-radius: 999px; padding: 9px 14px; background: var(--on-team); color: var(--team); font-family: var(--display); font-weight: 700; font-size: .92rem; text-transform: uppercase; letter-spacing: .03em; max-width: 52vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv:disabled { opacity: .55; }
.main { padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { border: 0; background: none; padding: 8px 0 7px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: .72rem; font-weight: 600; }
.tab svg { width: 22px; height: 22px; fill: currentColor; stroke: currentColor; stroke-width: 0; }
.tab:nth-child(4) svg, .tab:nth-child(5) svg { fill: none; stroke-width: 2; }
.tab.on { color: var(--ink); }
.tab.on svg { color: var(--team); }

/* cards and lists */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-align: left; width: 100%; display: block; }
button.card { cursor: pointer; }
.card.flush { padding: 0; overflow: hidden; }
.card.accent { border-color: var(--team); box-shadow: inset 4px 0 0 var(--team); }
.list { display: grid; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; min-height: 48px; }
.card > .li:first-child, .list > .li:first-child, .card .eyebrow + .li { border-top: 0; }
.card:not(.flush) .li { padding-left: 0; padding-right: 0; }
button.li:disabled { opacity: 1; cursor: default; }
.li.me { background: color-mix(in srgb, var(--team) 10%, transparent); }
.li.starter .num:first-child { color: var(--team); }
.li.on, .pickc.on { outline: 2px solid var(--team); outline-offset: -2px; }
.pos { font-family: var(--display); font-weight: 600; font-size: .8rem; color: var(--muted); width: 26px; flex: none; text-align: center; }
.li > .num:first-child { width: 26px; text-align: center; flex: none; }
.li > .num.pk { width: auto; min-width: 46px; text-align: left; }
.pg { font-family: var(--display); font-weight: 600; color: var(--muted); width: 22px; text-align: center; }
.rk { font-family: var(--display); font-weight: 600; font-size: .78em; color: var(--muted); margin-right: 3px; }
.tchip { display: inline-grid; place-items: center; min-width: 44px; height: 24px; padding: 0 6px; border-radius: 5px; background: var(--c); color: #fff; font-family: var(--display); font-weight: 700; font-size: .78rem; letter-spacing: .02em; flex: none; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.ovr { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; height: 26px; display: inline-grid; place-items: center; border-radius: 6px; font-size: .95rem; flex: none; }
.ovr.elite { background: var(--good); color: #fff; }
.ovr.good { background: var(--ink); color: var(--surface); }
.ovr.mid { background: var(--surface2); border: 1px solid var(--line); }
.ovr.low { border: 1px solid var(--line); color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }

/* controls */
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 42px; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: .84rem; }
.btn.ic { width: 34px; padding: 0; }
.btn.pri { background: var(--team); color: var(--on-team); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; padding: 0; color: inherit; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; min-height: 42px; }
.inp.sm { width: auto; min-height: 34px; padding: 5px 8px; }
textarea.inp { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.lbl { display: block; font-size: .82rem; font-weight: 600; margin: 10px 0 4px; }
.seg { display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; border: 0; background: none; padding: 8px 10px; border-radius: 7px; font-weight: 600; font-size: .86rem; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-family: var(--display); font-weight: 600; font-size: .85rem; }
.chips button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.switch { width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; }
.switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch.on { background: var(--team); } .switch.on i { left: 23px; }
.bar { flex: 1; height: 7px; background: var(--surface2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; display: block; min-width: 40px; }
.bar i { display: block; height: 100%; background: var(--team); }
.meter { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.meter > span:first-child { width: 92px; flex: none; }

/* home */
.game .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 8px 0 12px; }
.game .side { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.game .side b { font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; line-height: 1.05; }
.game .at { font-family: var(--display); color: var(--muted); font-weight: 600; text-transform: uppercase; }
.cmp { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.cmprow { display: grid; grid-template-columns: 1fr auto 1fr; text-align: center; align-items: center; }
.cmprow .num { font-size: 1.3rem; }
.cl { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.res .score { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 1.05rem; }
.res .score .num { font-size: 1.8rem; }
.wl { font-family: var(--display); font-weight: 700; font-size: 1.8rem; }
.res.w .wl { color: var(--good); } .res.l .wl { color: var(--bad); }
.res-s { font-family: var(--display); font-weight: 600; white-space: nowrap; }
.res-s.w { color: var(--good); } .res-s.l { color: var(--bad); }
.kv3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv3 > div { display: grid; }
.news { padding: 7px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.news:first-of-type { border-top: 0; }
.news.win { box-shadow: inset 3px 0 0 var(--good); padding-left: 9px; }
.news.loss, .news.inj { box-shadow: inset 3px 0 0 var(--bad); padding-left: 9px; }
.champ { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.champ b { font-family: var(--display); font-size: 1.6rem; text-transform: uppercase; }
.mv { width: 34px; text-align: right; font-family: var(--display); font-size: .8rem; }
.mv.up { color: var(--good); } .mv.down { color: var(--bad); }

/* recruiting */
.rec .intr { display: grid; gap: 4px; margin: 10px 0 8px; }
.ib { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 8px; }
.ib.me span:first-child { font-weight: 700; color: var(--team); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.score2 .num { margin-left: 4px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl th { font-family: var(--display); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 0; }
.tbl tr.me td { background: color-mix(in srgb, var(--team) 10%, transparent); }
.tbl tr.th td { font-family: var(--display); font-weight: 600; font-size: .78rem; color: var(--muted); text-transform: uppercase; background: var(--surface2); }
.tbl td .tchip { min-width: 40px; height: 20px; font-size: .7rem; margin-right: 4px; }
pre.code { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: .74rem; overflow-x: auto; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(5,10,18,.5); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 720px; margin: 0 auto; box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
.sheet-x { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; color: var(--muted); }
.ph { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; border-left: 4px solid var(--c); padding-left: 10px; margin: 4px 40px 10px 0; }
.phr { display: grid; justify-items: center; gap: 4px; }
.phr .ovr { min-width: 46px; height: 38px; font-size: 1.3rem; }
.attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
.attrs > div { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.final { display: grid; gap: 6px; margin: 8px 0 12px; }
.final > div { display: flex; align-items: center; gap: 10px; }
.final b { flex: 1; font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; }
.edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* start */
.start { padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
body:has(.start)::before { background: var(--bg); }
.hero { padding: 18px 0 6px; border-bottom: 3px solid var(--ink); }
.hero h1 { font-size: 2.7rem; }
.hero p { color: var(--muted); max-width: 52ch; }
.slot-h { display: flex; justify-content: space-between; }
.slot-t { font-family: var(--display); font-weight: 700; font-size: 1.4rem; text-transform: uppercase; }
.slot .row { margin-top: 10px; }
.pickc { text-align: left; }
.stickyfoot { position: sticky; bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: .9rem; max-width: calc(100% - 32px); box-shadow: 0 6px 18px rgba(0,0,0,.25); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---------- home ----------
function renderHome() {

  const u = userT(); const parts = [];
  if (G.phase === "pre" || G.phase === "reg") {
    const g = userGame(G.week || 1);
    if (g) {
      const opp = g.h === u.id ? g.a : g.h; const ot = opp >= 0 ? T(opp) : null;
      const ur = teamRating(u), or = ot ? teamRating(ot) : fcsRating();
      parts.push(`<section class="card game">
        <div class="eyebrow">Week ${g.wk} · ${g.n ? "Neutral site" : g.h === u.id ? "Home" : "Away"}${g.rv ? " · Rivalry" : ""}${g.cg ? " · Conference" : ""}</div>
        <div class="vs"><div class="side">${chip(u)}<b>${esc(u.name)}</b><span class="dim small">${recStr(u)}</span></div><div class="at">${g.h === u.id ? "vs" : "at"}</div>
        <div class="side">${ot ? chip(ot) : `<span class="tchip" style="--c:#777">FCS</span>`}<b>${ot ? tname(opp) : esc(g.fcs)}</b><span class="dim small">${ot ? recStr(ot) : "FCS"}</span></div></div>
        <div class="cmp">${[["Offense", ur.off, or.off], ["Defense", ur.def, or.def]].map(([l, a, b]) => `<div class="cmprow"><span class="num">${Math.round(a)}</span><span class="cl">${l}</span><span class="num">${Math.round(b)}</span></div>`).join("")}</div>

  if (G.phase === "post") {
    const mine = G.sched.filter(g => g.wk === 20 + G.post.round && (g.h === u.id || g.a === u.id) && !g.d)[0];
    parts.push(`<section class="card"><div class="eyebrow">${postRoundName()}</div>${mine ? `<p class="big">${esc(mine.nm)}</p><p>${tname(mine.h)} vs ${tname(mine.a)}</p>` : `<p>${G.sched.some(g => g.k !== "reg" && g.k !== "cc" && (g.h === u.id || g.a === u.id)) ? "Your season is over. Watch the rest of the postseason play out." : "You didn't make a bowl this year."}</p>`}<button class="btn" data-a="go" data-tab="season" data-sub="post">View postseason</button></section>`);
  }
  // last result
  const last = G.sched.filter(g => g.d && (g.h === u.id || g.a === u.id)).sort((a, b) => b.wk - a.wk)[0];
  if (last) { const us = last.h === u.id ? last.hs : last.as, th = last.h === u.id ? last.as : last.hs; parts.push(`<button class="card res ${us > th ? "w" : "l"}" data-a="game" data-v="${last.i}"><div class="eyebrow">Last game${last.nm ? " · " + esc(last.nm) : ""}</div><div class="score"><span class="wl">${us > th ? "W" : "L"}</span> <span class="num">${us}–${th}</span> <span>${last.h === u.id ? "vs" : "at"} ${oppName(last, u.id)}</span></div><div class="dim small">${esc(last.wx || "")} · Tap for box score</div></button>`); }
  // class status

function statusTags(p) { let s = ""; if (p.inj) s += ` <span class="tag bad">${p.inj >= 99 ? "Out for season" : "Inj " + p.inj + "w"}</span>`; if (p.sus) s += ` <span class="tag bad">Susp</span>`; if (p.sit) s += ` <span class="tag">Sit-out</span>`; if (p.rsNow) s += ` <span class="tag">Redshirting</span>`; if (p.wo) s += ` <span class="tag dim">Walk-on</span>`; return s; }

    <div class="chips">${["All", ...POS].map(p => `<button class="${UI.recPos === p ? "on" : ""}" data-a="set" data-k="recPos" data-v="${p}">${p}${p === "All" ? "" : ` <b class="need ${nd[p] ? "" : "zero"}">${nd[p]}</b>`}</button>`).join("")}</div>
    <p class="dim small">Bold number: how many more at each position you need for next year's roster.</p>
    <div class="row gap"><select class="inp" id="recStars" data-ch="recStars"><option value="0">All stars</option>${[5, 4, 3, 2].map(s => `<option value="${s}" ${UI.recStars === s ? "selected" : ""}>${s} stars</option>`).join("")}</select>
    <select class="inp" id="recState" data-ch="recState"><option value="">All states</option>${[...STATES].sort().map(s => `<option ${UI.recState === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>

function renderSeason() {
  let body = "";
  const u = G.userTeam;
  if (UI.seasonSub === "schedule") {
    const gs = G.sched.filter(g => g.h === u || g.a === u).sort((a, b) => a.wk - b.wk);
    body = `<div class="list card flush">${gs.map(g => { const home = g.h === u; const us = home ? g.hs : g.as, th = home ? g.as : g.hs; return `<button class="li" data-a="game" data-v="${g.i}" ${g.d ? "" : "disabled"}><span class="num dim small">${g.k === "reg" ? "W" + g.wk : g.k === "cc" ? "CCG" : "Post"}</span><span class="grow">${g.nm ? `<span class="dim small">${esc(g.nm)}</span><br>` : ""}${g.n ? "vs" : home ? "vs" : "at"} ${oppName(g, u)}${g.rv ? ` <span class="tag">Rivalry</span>` : ""}</span>${g.d ? `<span class="res-s ${us > th ? "w" : "l"}">${us > th ? "W" : "L"} ${us}–${th}</span>` : `<span class="dim small">${g.cg ? "Conf" : ""}</span>`}</button>`; }).join("")}</div>`;
  } else if (UI.seasonSub === "scores") {
    const weeks = [...new Set(G.sched.filter(g => g.d).map(g => g.wk))].sort((a, b) => a - b);

      const gs = G.sched.filter(g => g.wk === wk && g.d).sort((a, b) => Math.min(T(a.h).rk || 99, a.a >= 0 ? T(a.a).rk || 99 : 99) - Math.min(T(b.h).rk || 99, b.a >= 0 ? T(b.a).rk || 99 : 99));
      body = `<select class="inp" id="scoresWk" data-ch="scoresWk">${weeks.map(w => `<option value="${w}" ${w === wk ? "selected" : ""}>${wl(w)}</option>`).join("")}</select>
      <div class="list card flush">${gs.map(g => `<button class="li score2 ${g.h === u || g.a === u ? "me" : ""}" data-a="game" data-v="${g.i}"><span class="grow">${g.nm ? `<span class="dim small">${esc(g.nm)}</span><br>` : ""}<span class="${g.as > g.hs ? "b" : ""}">${g.a >= 0 ? tname(g.a) : esc(g.fcs)}</span> <span class="num">${g.as}</span><br><span class="${g.hs > g.as ? "b" : ""}">${tname(g.h)}</span> <span class="num">${g.hs}</span></span><span class="dim small">${g.ot ? "OT" : "Final"}</span></button>`).join("")}</div>`;
    }
  } else if (UI.seasonSub === "standings") {

    const st = c === "Independent" ? confTeams(c).sort((a, b) => b.w - a.w) : confStandings(c);
    body = `<select class="inp" id="standConf" data-ch="standConf">${confs.map(x => `<option ${x === c ? "selected" : ""}>${x}</option>`).join("")}</select>
    <div class="card flush tbl-wrap"><table class="tbl"><thead><tr><th>Team</th><th>Conf</th><th>All</th><th>PF</th><th>PA</th></tr></thead><tbody>${st.map(t => `<tr class="${t.id === u ? "me" : ""}"><td>${chip(t)} ${tname(t.id)}${t.champ && G.phase !== "reg" && G.phase !== "pre" ? " 🏆".replace("🏆", "<span class='tag good'>Champ</span>") : ""}</td><td class="num">${t.cw}-${t.cl}</td><td class="num">${t.w}-${t.l}</td><td class="num">${t.pf}</td><td class="num">${t.pa}</td></tr>`).join("")}</tbody></table></div>`;
  } else if (UI.seasonSub === "polls") {
    const ids = UI.pollType === "ap" ? G.ap : G.coaches;
    body = `${seg("pollType", [["ap", "AP Poll"], ["coaches", "Coaches Poll"]])}<div class="list card flush">${ids.map((id, i) => { const t = T(id); const mv = t.prk ? t.prk - (i + 1) : null; return `<div class="li ${id === u ? "me" : ""}"><span class="num">${i + 1}</span>${chip(t)}<span class="grow">${esc(t.name)} <span class="dim small">${esc(t.conf)}</span></span><span class="num">${recStr(t)}</span><span class="mv ${mv > 0 ? "up" : mv < 0 ? "down" : ""}">${UI.pollType === "ap" && mv ? (mv > 0 ? "▲" + mv : "▼" + -mv) : ""}</span></div>`; }).join("")}</div>`;
  } else {

      if (G.post.done) body = `<section class="card accent"><div class="eyebrow">National champion</div><p class="big">${esc(T(G.post.champ).name)}</p></section>` + body;
    }
  }
  return `${seg("seasonSub", [["schedule", "Schedule"], ["scores", "Scores"], ["standings", "Standings"], ["polls", "Polls"], ["post", "Postseason"]])}${body}`;

let DB = null, UID = null, DL = null, saving = false, saveAgain = false, saveTimer = null;
const CHUNK = 190000;
function b64(buf) { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
function unb64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function pack(str) { if (window.CompressionStream) { try { const st = new Blob([str]).stream().pipeThrough(new CompressionStream("gzip")); return "Z:" + b64(await new Response(st).arrayBuffer()); } catch (e) { } } return "J:" + str; }
async function unpack(s) { if (s.startsWith("Z:")) { const st = new Blob([unb64(s.slice(2))]).stream().pipeThrough(new DecompressionStream("gzip")); return await new Response(st).text(); } return s.slice(2); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function slotDoc(n, c) { return DB.doc(`data/users/${UID}/slot${n}${c == null ? "" : "c" + c}`); }

async function loadSlots() {

    if (DB) { try { const s = await slotDoc(n).get(); if (s.exists) cloud = s.data(); } catch (e) { } }
    const pickC = cloud && (!local || cloud.at >= local.at);
    UI.slots[n] = pickC ? { ...cloud, src: "cloud" } : local ? { ...local, src: "local" } : null;
  }
  UI.cloudNote = DB ? "Saves sync to your Claude account." : "Saves are kept on this device only.";
}
async function saveGame() {
  if (!G) return;
  if (saving) { saveAgain = true; return; }
  saving = true; UI.saving = "Saving…";
  try {
    const data = await pack(JSON.stringify(G));
    const n = UI.slot; const meta = metaNow();
    const parts = []; for (let i = 0; i < data.length; i += CHUNK) parts.push(data.slice(i, i + CHUNK));
    meta.n = parts.length;
    const okLocal = lsSet("gd_data" + n, data) && lsSet("gd_meta" + n, JSON.stringify(meta));
    if (!okLocal) { try { localStorage.removeItem("gd_data" + n); } catch (e) { } }
    let okCloud = false;
    if (DB) {
      try {
        const old = await slotDoc(n).get(); const oldN = old.exists ? (old.data().n || 0) : 0;
        for (let i = 0; i < parts.length; i++) await slotDoc(n, i).set({ d: parts[i] });
        for (let i = parts.length; i < oldN; i++) await slotDoc(n, i).delete();
        await slotDoc(n).set(meta); okCloud = true;
      } catch (e) { UI.saving = e && e.code === "quota_exceeded" ? "Cloud storage is full. Saved on this device." : "Couldn't reach your account. Saved on this device."; }
    }
    if (okCloud) UI.saving = "Saved to your account " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    else if (!DB) UI.saving = okLocal ? "Saved on this device." : "Couldn't save on this device. Download a save file to keep your progress.";
  } catch (e) { UI.saving = "Save failed. Download a save file to keep your progress."; }
  saving = false;
  if (saveAgain) { saveAgain = false; saveGame(); }
  if (UI.more === "saves") { UI.keepScroll = true; render(); }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveGame, 2500); }
async function loadGame(n) {
  const m = UI.slots[n]; if (!m) return;
  let data = null;
  try {
    if (m.src === "cloud" && DB) { const parts = []; for (let i = 0; i < m.n; i++) { const s = await slotDoc(n, i).get(); parts.push(s.exists ? s.data().d : ""); } data = parts.join(""); }
    if (!data) data = lsGet("gd_data" + n);
    if (!data) throw new Error("missing");
    G = JSON.parse(await unpack(data)); UI.slot = n; UI.tab = "home"; UI.more = null; render(); window.scrollTo(0, 0);
  } catch (e) { toast("That save couldn't be opened."); }
}

// ---------- position change ----------
const FAMILY = { QB: "QB", RB: "SK", WR: "SK", TE: "TE", OL: "OL", DL: "DF", LB: "DF", CB: "DB", S: "DB", K: "KP", P: "KP" };
function changePos(p, np) {
  if (np === p.pos) return;
  const pair = [p.pos, np].sort().join("-");
  const pen = { "CB-S": 3, "RB-WR": 5, "DL-LB": 5, "LB-S": 6, "CB-WR": 6, "OL-TE": 8, "TE-WR": 6, "DL-OL": 7, "K-P": 4, "LB-TE": 8, "RB-S": 9, "QB-WR": 9, "QB-RB": 10, "RB-TE": 8, "CB-RB": 8 }[pair];
  const d = pen != null ? pen : 16;
  const old = p.pos; p.pos = np; p.ovr = clamp(p.ovr - d, 30, 99); p.pot = clamp(p.pot - Math.round(d / 2), p.ovr, 99); p.at = genAttrs(np, p.ovr);
  const t = T(p.t); t.depth[old] = (t.depth[old] || []).filter(x => x !== p.id); cleanDepth(t);
  toast(`${playerName(p)} moves from ${old} to ${np} (${p.ovr} OVR).`);
}

// ---------- events ----------
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v, k = el.dataset.k;
  const num = x => (x != null && x !== "" && !isNaN(x)) ? +x : x;
  switch (a) {
    case "tab": UI.tab = v; UI.modal = null; if (v === "more") UI.more = null; render(); window.scrollTo(0, 0); return;
    case "set": UI[k] = num(v); if (k === "recPos") UI.recLimit = 50; UI.keepScroll = k !== "teamSub" && k !== "seasonSub" && k !== "recSub"; render(); return;
    case "go": UI.tab = el.dataset.tab; if (el.dataset.sub) UI.seasonSub = el.dataset.sub; render(); window.scrollTo(0, 0); return;
    case "close": UI.modal = null; UI.keepScroll = true; render(); return;
    case "advance": return doAdvance(!!el.dataset.force);
    case "game": UI.modal = { type: "game", id: +v }; UI.keepScroll = true; render(); return;
    case "player": UI.modal = { type: "player", id: +v, edit: !!el.dataset.edit }; UI.keepScroll = true; render(); return;
    case "recruit": UI.modal = { type: "recruit", id: +v }; UI.keepScroll = true; render(); return;
    case "board": if (!G.board.includes(+v) && G.board.length < 35) G.board.push(+v); UI.keepScroll = true; render(); toast("Added to your board."); return;
    case "unboard": G.board = G.board.filter(x => x !== +v); UI.keepScroll = true; render(); return;
    case "ract": { const err = userAct(G.recruits[+v], k, 50000); UI.keepScroll = true; if (err) toast(err); else { const r = G.recruits[+v]; toast(k === "scout" ? `Scouted: ${r.ovr} OVR, ${r.pot} potential.` : k === "official" || k === "unofficial" ? "Visit set for this week's home game." : "Done."); } saveSoon(); return; }
    case "autoon": { const s2 = autoSettings(); s2.on = !s2.on; UI.keepScroll = true; render(); toast(s2.on ? "Auto recruit will run every week." : "Auto recruit is off."); saveSoon(); return; }
    case "autorun": { const h = G.hours; const res = runAutoRecruit(); UI.keepScroll = true; render(); toast(res.acts ? `Auto recruit used ${h - G.hours} hours on ${G.board.length} recruits.` : "Nothing left to do this week."); saveSoon(); return; }
    case "clearQ": UI.recQ = ""; UI.keepScroll = true; render(); return;
    case "moreRec": UI.recLimit += 50; UI.keepScroll = true; render(); return;
    case "autodepth": { const t = userT(); if (G.autoDepth === false) { G.autoDepth = true; autoDepth(t); } else { G.autoDepth = false; cleanDepth(t); } UI.keepScroll = true; render(); saveSoon(); return; }
    case "dmove": { const t = userT(); if (G.autoDepth !== false) { G.autoDepth = false; } const arr = t.depth[UI.depthPos]; const i = +v, j = i + +el.dataset.d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; UI.keepScroll = true; render(); saveSoon(); return; }
    case "redshirt": { const p = P(+v); p.rsNow = !p.rsNow; UI.keepScroll = true; render(); toast(p.rsNow ? `${playerName(p)} will redshirt.` : "Redshirt removed."); saveSoon(); return; }
    case "perk": takePerk(k, +v); UI.keepScroll = true; render(); saveSoon(); return;
    case "takejob": takeJob(+v); render(); toast(`You're the new head coach at ${userT().name}.`); saveSoon(); return;
    case "hire": { const err = hireCoord(k, +v); UI.keepScroll = true; if (err) toast(err); else render(); saveSoon(); return; }
    case "bud": { const d = +v; G.budget[k] = Math.max(0, (G.budget[k] || 0) + d); if (budgetLeft() < 0) { G.budget[k] -= d; toast("That's over budget."); } UI.keepScroll = true; render(); saveSoon(); return; }
    case "pitch": { const e2 = G.portal.find(x => x.id === +v); const err = pitchPortal(e2); UI.keepScroll = true; if (err) toast(err); else toast(e2.ok ? `${playerName(P(e2.id))} is coming to ${userT().name}!` : "He picked another school."); saveSoon(); return; }
    case "fictional": useFictionalClass(); render(); toast(`Generated a ${G.classYear} class of ${G.recruits.length} recruits.`); saveSoon(); return;
    case "more": UI.tab = "more"; UI.more = v || null; render(); window.scrollTo(0, 0); return;
    case "recPaste": { const txt = document.getElementById("recPaste").value; if (!txt.trim()) return toast("Paste a CSV first."); return doImport("rec", txt); }
    case "savePlayer": { const p = P(+v); const f = document.getElementById("edF").value.trim(), l = document.getElementById("edL").value.trim(); if (f) p.f = f; p.l = l; const o = clamp(parseInt(document.getElementById("edO").value) || p.ovr, 30, 99); const d = o - p.ovr; p.ovr = o; recalcAttrs(p, d); p.pot = clamp(parseInt(document.getElementById("edP").value) || p.pot, p.ovr, 99); p.yr = +document.getElementById("edY").value; UI.keepScroll = true; render(); toast("Player saved."); saveSoon(); return; }
    case "saveTeamName": { const n = document.getElementById("edTeamName").value.trim(); if (n) T(+v).name = n; render(); toast("Team renamed."); saveSoon(); return; }
    case "saveNow": saveGame(); toast("Saving…"); return;
    case "exportSave": return exportSave();
    case "quit": saveGame().then(() => { G = null; UI.ng = null; loadSlots().then(render); }); return;
    case "load": return loadGame(+v);
    case "newgame": UI.slot = +v; UI.ng = { step: 1, name: "", arch: "Recruiter", diff: "normal", team: null }; render(); return;
    case "ngback": if (UI.ng.step === 1) UI.ng = null; else UI.ng.step = 1; render(); return;
    case "ngarch": UI.ng.arch = v; render(); return;
    case "ngnext": UI.ng.step = 2; render(); window.scrollTo(0, 0); return;
    case "ngdiff": UI.ng.diff = v; UI.ng.team = null; render(); return;
    case "ngteam": UI.ng.team = +v; UI.keepScroll = true; render(); return;
    case "ngstart": { const ng = UI.ng; $app.innerHTML = `<div class="start"><div class="hero"><div class="eyebrow">Building 2009</div><h1>Setting up 120 programs…</h1></div></div>`; setTimeout(() => { newGame({ team: ng.team, coachName: ng.name.trim(), arch: ng.arch }); UI.ng = null; UI.tab = "home"; render(); window.scrollTo(0, 0); saveGame(); }, 30); return; }
  }
});
document.addEventListener("input", e => { const el = e.target;
  if (el.dataset.in === "recQ") { UI.recQ = el.value; UI.recLimit = 50; const pos = el.selectionStart; UI.keepScroll = true; render(); const n = document.getElementById("recQ"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } return; } if (el.dataset.ch === "ngname") { UI.ng.name = el.value; const b = document.querySelector('[data-a="ngnext"]'); if (b) b.disabled = !el.value.trim(); } });
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset.ch; if (!k) return;
  const t = G ? userT() : null;
  switch (k) {

    case "recFile": case "rosFile": case "importSave": { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { if (k === "importSave") importSaveText(rd.result); else doImport(k === "recFile" ? "rec" : "ros", rd.result); }; rd.readAsText(f); return; }
  }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && G) saveGame(); });

function doImport(kind, text) {
  try {
    const res = kind === "rec" ? importRecruits(text) : importRosters(text);
    if (res.err) return toast(res.err);
    render();
    toast(kind === "rec" ? `Loaded ${res.n} recruits for ${G.classYear}${res.skip ? ` (${res.skip} rows skipped)` : ""}.` : `Rebuilt ${res.teams} roster${res.teams > 1 ? "s" : ""} with ${res.n} players${res.skip ? ` (${res.skip} rows skipped)` : ""}.`);
    saveSoon();
  } catch (e) { toast("Couldn't read that file. Check that it's a CSV with a header row."); }
}
async function exportSave() {
  const data = await pack(JSON.stringify(G));
  if (!DL) { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/plain" })); a.download = `dynasty-${userT().abbr.toLowerCase()}-${G.year}.txt`; document.body.appendChild(a); a.click(); a.remove(); toast("Save file downloaded."); } catch (e) { toast("Couldn't download the save file."); } return; }
  try { await DL.save({ filename: `dynasty-${userT().abbr.toLowerCase()}-${G.year}.txt`, data }); toast("Save file ready."); }
  catch (e) { toast(e && e.code === "declined" ? "Download cancelled." : "Couldn't download the save file."); }
}
async function importSaveText(txt) {
  try {
    const s = txt.trim(); const json = s.startsWith("{") ? s : await unpack(s);
    const g = JSON.parse(json); if (!g.teams || !g.players) throw 0;
    const empty = [1, 2, 3].find(n => !UI.slots[n]) || 3;
    G = g; UI.slot = empty; UI.tab = "home"; render(); toast(`Loaded into save ${empty}.`); saveGame();
  } catch (e) { toast("That isn't a dynasty save file."); }
}
function doAdvance(force) {
  if (UI.busy) return;
  if (G.phase === "pre" && !G.classSource && !G.recruits.length && !force) { UI.modal = { type: "confirmStart" }; render(); return; }
  if (force && !G.recruits.length) useFictionalClass();
  UI.modal = null; UI.busy = true; render();
  setTimeout(() => {
    try { if (G.autoRec && G.autoRec.on && G.phase !== "off") runAutoRecruit(); advance(); } catch (e) { console.error(e); toast("Something went wrong simulating. Your last save is safe."); }
    UI.busy = false; UI.tab = "home"; render(); window.scrollTo(0, 0); saveGame();
  }, 40);
}

// no pinch or double-tap zoom

document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouch = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTouch < 300 && !e.target.closest("input,select,textarea")) e.preventDefault(); lastTouch = now; }, { passive: false });

(async function boot() {
  render();
  await cloudInit();
  await loadSlots();
  render();
})();
